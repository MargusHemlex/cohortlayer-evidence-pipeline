[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cohortlayer-evidence-demo"
version = "0.1.0"
description = "Synthetic cross-cohort evidence comparison with reproducible provenance"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "MIT"
dependencies = ["pydantic>=2.11,<3", "rfc8785>=0.1.4,<1"]

[project.scripts]
cohortlayer-demo = "cohortlayer_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cohortlayer_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

